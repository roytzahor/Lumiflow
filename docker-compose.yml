version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumiflow
      POSTGRES_PASSWORD: lumiflow
      POSTGRES_DB: lumiflow
    ports:
      - "5433:5432"
    volumes:
      - lumiflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumiflow -d lumiflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumiflow-postgres-data:
