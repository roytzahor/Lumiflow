name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumiflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumiflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumiflow?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lumiflow?schema=public
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prisma generate
      - run: yarn prisma migrate deploy
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:unit
      - run: yarn build
      - run: CYPRESS_PROD_BUILD=1 yarn start-server-and-test "yarn start" http://localhost:3000/auth/signup "yarn test:e2e"
